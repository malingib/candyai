name: Refresh pnpm lockfile
on:
  push:
    branches:
      - candyai/implementation-hardening
    paths:
      - package.json
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candyai/implementation-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile for vite plugin"
          git push origin HEAD:candyai/implementation-hardening

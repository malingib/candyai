## Verify a configured PR review deployment; do not assume a Heroku app exists.
name: Deploy Check

on:
  pull_request:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment_check:
    name: Check Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Skip when no review deployment is configured
        if: ${{ vars.PR_REVIEW_DEPLOYMENT_URL == '' }}
        run: echo "No PR_REVIEW_DEPLOYMENT_URL configured; external deployment verification is skipped."
      - name: Verify configured review deployment
        if: ${{ vars.PR_REVIEW_DEPLOYMENT_URL != '' }}
        env:
          DEPLOYMENT_URL: ${{ vars.PR_REVIEW_DEPLOYMENT_URL }}
        run: |
          set -euo pipefail
          url="${DEPLOYMENT_URL%/}/api"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status_code="$(curl --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors --output "$response_file" --write-out '%{http_code}' "$url")"
          test "$status_code" = "200"
          jq -e '.version and .timestamp and .queue_services == "ok" and .data_services == "ok"' "$response_file"
          echo "Configured review deployment is healthy."

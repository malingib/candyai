name: Refresh Rails 8 lockfile

on:
  push:
    branches:
      - candyai/implementation-hardening
    paths:
      - Gemfile
      - app/dashboards/account_user_dashboard.rb

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
      - name: Resolve Rails 8 dependency graph
        run: bundle update rails administrate rails-i18n administrate-field-active_storage --conservative
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- Gemfile.lock; then
            echo "Gemfile.lock already matches Gemfile"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Resolve patched Rails 8 dependency lockfile"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

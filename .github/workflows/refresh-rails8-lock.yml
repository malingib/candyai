name: Refresh Rails 8 lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - candyai/implementation-hardening
    paths:
      - Gemfile
      - app/dashboards/account_user_dashboard.rb
      - .github/workflows/refresh-rails8-lock.yml

concurrency:
  group: rails8-lockfile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
      - name: Resolve and validate dependency graph
        run: |
          bundle update rails administrate rails-i18n administrate-field-active_storage --conservative
          bundle check
          ruby -e "lock = File.read('Gemfile.lock'); abort 'Rails lockfile is not 8.1.4.1' unless lock.match?(/^    rails \(8\.1\.4\.1\)$/)"
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- Gemfile.lock; then
            echo "Gemfile.lock already matches Gemfile"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Resolve patched Rails 8.1 dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"

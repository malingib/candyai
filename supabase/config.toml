[auth]
site_url = "https://mobiwaveai.co.ke"
additional_redirect_urls = [
  "https://mobiwaveai.co.ke",
  "https://mobiwaveai.co.ke/reset-password",
  "https://www.mobiwaveai.co.ke",
  "https://www.mobiwaveai.co.ke/reset-password"
]

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

